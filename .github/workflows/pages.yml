name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html robots.txt sitemap.xml _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -f site.webmanifest ]; then cp site.webmanifest _site/; fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' _site/sitemap.xml
          grep -Fq '<loc>https://moqleh.github.io/mohammed-al-oqleh-official/</loc>' _site/sitemap.xml
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published SEO files
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --output /tmp/sitemap.xml "${SITE_URL%/}/sitemap.xml"
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' /tmp/sitemap.xml
          grep -Fq '<loc>https://moqleh.github.io/mohammed-al-oqleh-official/</loc>' /tmp/sitemap.xml
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --output /tmp/robots.txt "${SITE_URL%/}/robots.txt"
          grep -Fq 'Sitemap: https://moqleh.github.io/mohammed-al-oqleh-official/sitemap.xml' /tmp/robots.txt
