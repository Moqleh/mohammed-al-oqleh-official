name: Install visitor counter fallback
on:
  push:
    paths:
      - '.visitor-counter-trigger'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh project script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="assets/js/visitor-counter-fallback.js" defer></script>'
          new='<script src="assets/js/visitor-counter-fallback.js?v=20260911-2" defer></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('</body>',new+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Force fresh Daily Tools card script"
          git push